<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">The Last Ferry</title>
  <desc id="desc">A late-night ferry schedule between San Remo and the island of Vell.</desc>

  <rect width="1080" height="1350" fill="#F2E9D7"/>

  <g fill="#17333A">
    <rect x="78" y="91" width="12" height="67"/>
    <text x="112" y="119" font-family="monospace" font-size="20" letter-spacing="2">SAN REMO  /  ISLAND OF VELL</text>
    <text x="112" y="151" font-family="monospace" font-size="16" letter-spacing="2">NIGHT SERVICE · DAILY</text>
  </g>

  <g fill="#C94B32">
    <text x="1002" y="119" text-anchor="end" font-family="monospace" font-size="18" letter-spacing="2">LAST CROSSING</text>
    <text x="1002" y="158" text-anchor="end" font-family="Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="1">11:40 PM</text>
  </g>

  <text x="78" y="302" fill="#17333A" font-family="'Arial Narrow', 'Liberation Sans Narrow', sans-serif" font-size="64" font-weight="700" letter-spacing="5">THE LAST</text>
  <text x="63" y="511" fill="#17333A" font-family="'Arial Narrow', 'Liberation Sans Narrow', sans-serif" font-size="220" font-weight="900" letter-spacing="-10">FERRY</text>

  <rect x="78" y="565" width="924" height="470" fill="#17333A"/>
  <rect x="78" y="565" width="18" height="470" fill="#C94B32"/>

  <g fill="#F2E9D7" font-family="monospace">
    <text x="122" y="622" font-size="19" letter-spacing="3">TONIGHT'S SAILINGS</text>
    <text x="958" y="622" text-anchor="end" font-size="16" letter-spacing="2">CROSSING  ·  35 MIN</text>
  </g>

  <line x1="122" y1="650" x2="958" y2="650" stroke="#F2E9D7" stroke-width="2" opacity=".45"/>

  <g fill="#F2E9D7" font-family="monospace">
    <text x="122" y="754" font-size="62" letter-spacing="-3">23:40</text>
    <text x="425" y="709" font-size="15" letter-spacing="2">FROM</text>
    <text x="425" y="756" font-size="30" letter-spacing="1">SAN REMO</text>
    <line x1="654" y1="740" x2="739" y2="740" stroke="#C94B32" stroke-width="4"/>
    <path d="M739 731 L755 740 L739 749 Z" fill="#C94B32"/>
    <text x="786" y="709" font-size="15" letter-spacing="2">TO</text>
    <text x="786" y="756" font-size="30" letter-spacing="1">VELL</text>
  </g>

  <line x1="122" y1="798" x2="958" y2="798" stroke="#F2E9D7" stroke-width="2" opacity=".3"/>

  <g fill="#F2E9D7" font-family="monospace">
    <text x="122" y="905" font-size="62" letter-spacing="-3">00:15</text>
    <text x="425" y="860" font-size="15" letter-spacing="2">FROM</text>
    <text x="425" y="907" font-size="30" letter-spacing="1">VELL</text>
    <line x1="654" y1="891" x2="739" y2="891" stroke="#C94B32" stroke-width="4"/>
    <path d="M739 882 L755 891 L739 900 Z" fill="#C94B32"/>
    <text x="786" y="860" font-size="15" letter-spacing="2">TO</text>
    <text x="786" y="907" font-size="30" letter-spacing="1">SAN REMO</text>
  </g>

  <line x1="122" y1="950" x2="958" y2="950" stroke="#F2E9D7" stroke-width="2" opacity=".3"/>
  <text x="122" y="995" fill="#C94B32" font-family="monospace" font-size="16" letter-spacing="2">BOARDING CLOSES 5 MIN BEFORE DEPARTURE</text>

  <text x="78" y="1122" fill="#17333A" font-family="'Arial Narrow', 'Liberation Sans Narrow', sans-serif" font-size="38" font-weight="700">For the ones still getting home.</text>

  <line x1="78" y1="1173" x2="1002" y2="1173" stroke="#17333A" stroke-width="2"/>
  <g stroke="#C94B32" stroke-width="3">
    <line x1="94" y1="1165" x2="94" y2="1181"/>
    <line x1="110" y1="1165" x2="110" y2="1181"/>
    <line x1="126" y1="1165" x2="126" y2="1181"/>
    <line x1="142" y1="1165" x2="142" y2="1181"/>
    <line x1="158" y1="1165" x2="158" y2="1181"/>
    <line x1="174" y1="1165" x2="174" y2="1181"/>
    <line x1="190" y1="1165" x2="190" y2="1181"/>
  </g>

  <text x="78" y="1261" fill="#17333A" font-family="monospace" font-size="27" letter-spacing="1">ferry.vell/1140</text>
  <text x="1002" y="1261" text-anchor="end" fill="#C94B32" font-family="monospace" font-size="16" letter-spacing="2">KEEP THIS CLOSE</text>
</svg>
