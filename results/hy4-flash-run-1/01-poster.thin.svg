<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040814"/>
      <stop offset="0.35" stop-color="#08122a"/>
      <stop offset="0.7" stop-color="#102138"/>
      <stop offset="1" stop-color="#1a2f47"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16283e"/>
      <stop offset="0.25" stop-color="#0d1a2d"/>
      <stop offset="0.7" stop-color="#071021"/>
      <stop offset="1" stop-color="#03070f"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6f1dc" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#dfe6e0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#cfe0e6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonBody" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#fffdf2"/>
      <stop offset="0.75" stop-color="#eef0e2"/>
      <stop offset="1" stop-color="#cdd6cf"/>
    </radialGradient>
    <linearGradient id="moonPath" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dfe7e2" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#dfe7e2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fb4c4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#9fb4c4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#9fb4c4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0.45"/>
      <stop offset="0.18" stop-color="#000" stop-opacity="0"/>
      <stop offset="0.85" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tinyGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- SKY -->
  <rect width="1080" height="1350" fill="url(#sky)"/>

  <!-- STARS -->
  <g fill="#dfe8f2">
    <circle cx="70" cy="120" r="1.3" opacity="0.8"/>
    <circle cx="140" cy="210" r="0.9" opacity="0.5"/>
    <circle cx="205" cy="95" r="1.6" opacity="0.9"/>
    <circle cx="262" cy="180" r="1.0" opacity="0.6"/>
    <circle cx="330" cy="130" r="0.8" opacity="0.45"/>
    <circle cx="392" cy="245" r="1.4" opacity="0.75"/>
    <circle cx="455" cy="105" r="1.0" opacity="0.55"/>
    <circle cx="520" cy="200" r="0.9" opacity="0.5"/>
    <circle cx="585" cy="140" r="1.7" opacity="0.85"/>
    <circle cx="640" cy="235" r="1.1" opacity="0.6"/>
    <circle cx="700" cy="110" r="0.9" opacity="0.5"/>
    <circle cx="880" cy="90" r="1.5" opacity="0.8"/>
    <circle cx="945" cy="170" r="1.0" opacity="0.55"/>
    <circle cx="1010" cy="120" r="1.3" opacity="0.7"/>
    <circle cx="1050" cy="230" r="0.9" opacity="0.5"/>
    <circle cx="95" cy="320" r="1.1" opacity="0.55"/>
    <circle cx="180" cy="395" r="0.8" opacity="0.4"/>
    <circle cx="300" cy="340" r="1.2" opacity="0.6"/>
    <circle cx="410" cy="415" r="0.9" opacity="0.45"/>
    <circle cx="500" cy="330" r="1.0" opacity="0.5"/>
    <circle cx="615" cy="390" r="0.8" opacity="0.4"/>
    <circle cx="860" cy="360" r="1.2" opacity="0.6"/>
    <circle cx="960" cy="420" r="0.9" opacity="0.45"/>
    <circle cx="1030" cy="330" r="1.0" opacity="0.5"/>
    <circle cx="40" cy="470" r="0.8" opacity="0.35"/>
    <circle cx="760" cy="470" r="0.9" opacity="0.4"/>
    <circle cx="720" cy="175" r="0.7" opacity="0.4"/>
    <circle cx="810" cy="255" r="1.0" opacity="0.5"/>
  </g>
  <g fill="#fff" filter="url(#tinyGlow)" opacity="0.85">
    <circle cx="585" cy="140" r="1.2"/>
    <circle cx="205" cy="95" r="1.2"/>
    <circle cx="880" cy="90" r="1.1"/>
  </g>

  <!-- MOON -->
  <circle cx="770" cy="300" r="180" fill="url(#moonGlow)"/>
  <circle cx="770" cy="300" r="58" fill="url(#moonBody)" filter="url(#glow)"/>
  <circle cx="770" cy="300" r="58" fill="url(#moonBody)"/>
  <g fill="#c4cdc4" opacity="0.35">
    <circle cx="752" cy="282" r="9"/>
    <circle cx="788" cy="315" r="6"/>
    <circle cx="768" cy="326" r="4"/>
    <circle cx="790" cy="281" r="3.5"/>
  </g>

  <!-- DISTANT CLOUD BANDS -->
  <g fill="#8fa6bd" opacity="0.07" filter="url(#soft)">
    <ellipse cx="300" cy="520" rx="360" ry="22"/>
    <ellipse cx="820" cy="600" rx="420" ry="26"/>
    <ellipse cx="520" cy="660" rx="500" ry="20"/>
  </g>

  <!-- HORIZON / WATER -->
  <rect x="0" y="770" width="1080" height="580" fill="url(#water)"/>
  <line x1="0" y1="770" x2="1080" y2="770" stroke="#2b4259" stroke-width="1" opacity="0.6"/>

  <!-- MOONLIT PATH ON WATER -->
  <path d="M770 770 L846 1350 L694 1350 Z" fill="url(#moonPath)"/>
  <g fill="#e7ede6">
    <ellipse cx="770" cy="800" rx="26" ry="2" opacity="0.30"/>
    <ellipse cx="766" cy="835" rx="34" ry="2.2" opacity="0.26"/>
    <ellipse cx="775" cy="872" rx="30" ry="2" opacity="0.22"/>
    <ellipse cx="762" cy="915" rx="42" ry="2.4" opacity="0.20"/>
    <ellipse cx="778" cy="962" rx="38" ry="2.2" opacity="0.16"/>
    <ellipse cx="764" cy="1015" rx="50" ry="2.6" opacity="0.14"/>
    <ellipse cx="782" cy="1075" rx="46" ry="2.4" opacity="0.11"/>
    <ellipse cx="766" cy="1145" rx="60" ry="3" opacity="0.09"/>
    <ellipse cx="780" cy="1225" rx="70" ry="3" opacity="0.06"/>
  </g>

  <!-- WATER RIPPLES -->
  <g stroke="#7d97b0" stroke-width="1" opacity="0.10">
    <line x1="60" y1="820" x2="240" y2="820"/>
    <line x1="320" y1="850" x2="520" y2="850"/>
    <line x1="90" y1="890" x2="330" y2="890"/>
    <line x1="830" y1="860" x2="1030" y2="860"/>
    <line x1="40" y1="960" x2="260" y2="960"/>
    <line x1="300" y1="1010" x2="500" y2="1010"/>
    <line x1="560" y1="1080" x2="780" y2="1080"/>
    <line x1="120" y1="1110" x2="360" y2="1110"/>
    <line x1="820" y1="1160" x2="1040" y2="1160"/>
    <line x1="60" y1="1240" x2="300" y2="1240"/>
    <line x1="360" y1="1280" x2="620" y2="1280"/>
    <line x1="740" y1="1300" x2="1010" y2="1300"/>
  </g>

  <!-- LEFT ISLAND -->
  <path d="M0 770 L0 700 Q40 690 80 706 Q120 716 160 700 Q200 686 250 704 Q300 720 355 748 L380 770 Z" fill="#050d18"/>
  <g filter="url(#tinyGlow)">
    <circle cx="120" cy="712" r="1.8" fill="#f4c27a" opacity="0.9"/>
    <circle cx="150" cy="706" r="1.5" fill="#f4c27a" opacity="0.7"/>
    <circle cx="210" cy="708" r="1.6" fill="#f4c27a" opacity="0.8"/>
  </g>
  <path d="M0 700 Q40 690 80 706 Q120 716 160 700" fill="none" stroke="#1b2c3f" stroke-width="1" opacity="0.7"/>

  <!-- RIGHT ISLAND -->
  <path d="M1080 770 L1080 668 Q1040 660 1000 678 Q960 694 920 680 Q880 666 840 688 Q800 710 762 740 L740 770 Z" fill="#050d18"/>
  <g filter="url(#tinyGlow)">
    <circle cx="1010" cy="682" r="1.8" fill="#f4c27a" opacity="0.85"/>
    <circle cx="975" cy="676" r="1.5" fill="#f4c27a" opacity="0.7"/>
    <circle cx="930" cy="686" r="1.6" fill="#f4c27a" opacity="0.8"/>
    <circle cx="900" cy="694" r="1.3" fill="#f4c27a" opacity="0.6"/>
  </g>
  <path d="M1080 668 Q1040 660 1000 678 Q960 694 920 680" fill="none" stroke="#1b2c3f" stroke-width="1" opacity="0.7"/>

  <!-- LIGHTHOUSE ON RIGHT ISLAND -->
  <g>
    <rect x="995" y="640" width="7" height="34" fill="#040b14"/>
    <path d="M993 640 L1004 640 L1001 632 L996 632 Z" fill="#040b14"/>
    <circle cx="998.5" cy="636" r="2.6" fill="#ffd98a" filter="url(#glow)"/>
  </g>

  <!-- MIST BANDS OVER WATER -->
  <rect x="0" y="744" width="1080" height="80" fill="url(#mist)"/>
  <ellipse cx="540" cy="786" rx="560" ry="14" fill="#9fb4c4" opacity="0.06" filter="url(#soft)"/>

  <!-- FERRY REFLECTION (faded, broken) -->
  <g opacity="0.22" filter="url(#soft)">
    <path d="M430 852 L650 852 L636 884 Q540 900 444 884 Z" fill="#c98f4a"/>
    <rect x="470" y="856" width="140" height="10" fill="#ffcf85"/>
  </g>
  <g opacity="0.16">
    <ellipse cx="470" cy="872" rx="34" ry="2" fill="#ffcf85"/>
    <ellipse cx="560" cy="878" rx="44" ry="2" fill="#ffcf85"/>
    <ellipse cx="640" cy="870" rx="30" ry="2" fill="#ffcf85"/>
  </g>

  <!-- THE FERRY -->
  <g>
    <!-- soft waterline halo -->
    <ellipse cx="540" cy="852" rx="150" ry="10" fill="#000" opacity="0.35" filter="url(#soft)"/>

    <!-- hull -->
    <path d="M410 820 L670 820 L655 850 Q540 868 425 850 Z" fill="#070e18"/>
    <path d="M410 820 L670 820 L667 825 L413 825 Z" fill="#16283a"/>
    <path d="M425 850 Q540 868 655 850" fill="none" stroke="#2a3f55" stroke-width="1" opacity="0.8"/>

    <!-- lower deck -->
    <rect x="438" y="792" width="204" height="30" fill="#0a1420"/>
    <rect x="438" y="792" width="204" height="3" fill="#1c2d40"/>

    <!-- cabin -->
    <rect x="460" y="756" width="160" height="38" rx="3" fill="#0c1725"/>
    <path d="M456 756 L470 744 L610 744 L624 756 Z" fill="#0a1420"/>
    <rect x="460" y="756" width="160" height="3" fill="#203247"/>

    <!-- windows: warm glowing row -->
    <g filter="url(#glow)">
      <rect x="470" y="764" width="16" height="12" rx="1.5" fill="#ffc878"/>
      <rect x="494" y="764" width="16" height="12" rx="1.5" fill="#ffc878"/>
      <rect x="518" y="764" width="16" height="12" rx="1.5" fill="#ffd98f"/>
      <rect x="542" y="764" width="16" height="12" rx="1.5" fill="#ffc878"/>
      <rect x="566" y="764" width="16" height="12" rx="1.5" fill="#ffc878"/>
      <rect x="590" y="764" width="16" height="12" rx="1.5" fill="#ffd98f"/>
    </g>
    <!-- lower deck windows -->
    <g opacity="0.75">
      <rect x="452" y="800" width="14" height="9" rx="1" fill="#e9a85e"/>
      <rect x="478" y="800" width="14" height="9" rx="1" fill="#e9a85e"/>
      <rect x="540" y="800" width="14" height="9" rx="1" fill="#e9a85e"/>
      <rect x="566" y="800" width="14" height="9" rx="1" fill="#e9a85e"/>
      <rect x="614" y="800" width="14" height="9" rx="1" fill="#e9a85e"/>
    </g>

    <!-- funnel / mast -->
    <rect x="528" y="728" width="16" height="18" fill="#0a1420"/>
    <rect x="526" y="726" width="20" height="3" fill="#1c2d40"/>
    <line x1="536" y1="726" x2="536" y2="700" stroke="#16283a" stroke-width="2"/>
    <circle cx="536" cy="698" r="2.5" fill="#ff8f6a" filter="url(#glow)"/>

    <!-- bow light -->
    <circle cx="662" cy="812" r="2.4" fill="#8ef0b5" filter="url(#glow)"/>
    <circle cx="420" cy="812" r="2.2" fill="#ff7a6a" filter="url(#glow)"/>
  </g>

  <!-- FOREGROUND MIST -->
  <rect x="0" y="860" width="1080" height="60" fill="url(#mist)" opacity="0.7"/>

  <!-- OVERALL VIGNETTE -->
  <rect width="1080" height="1350" fill="url(#vignette)"/>

  <!-- POSTER FRAME -->
  <rect x="34" y="34" width="1012" height="1282" fill="none" stroke="#c9c2ab" stroke-width="1" opacity="0.35"/>
  <rect x="44" y="44" width="992" height="1262" fill="none" stroke="#c9c2ab" stroke-width="0.5" opacity="0.18"/>

  <!-- TYPOGRAPHY -->
  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="540" y="150" font-size="22" letter-spacing="12" fill="#cfc8b2" opacity="0.85">A CROSSING BETWEEN TWO ISLANDS</text>
    <text x="540" y="258" font-size="86" letter-spacing="6" fill="#f0ebdc">THE LAST FERRY</text>
  </g>

  <line x1="300" y1="292" x2="780" y2="292" stroke="#c9c2ab" stroke-width="1" opacity="0.45"/>

  <g text-anchor="middle" font-family="Helvetica, Arial, sans-serif">
    <text x="540" y="350" font-size="40" letter-spacing="14" fill="#f4c27a" font-weight="300">11:40 PM</text>
  </g>

  <!-- footer details -->
  <g text-anchor="middle" font-family="Helvetica, Arial, sans-serif" fill="#bfc7cf" opacity="0.7">
    <text x="540" y="1235" font-size="14" letter-spacing="6">NIGHT SERVICE · FINAL DEPARTURE</text>
    <text x="540" y="1268" font-size="12" letter-spacing="4" opacity="0.75">ONE VOYAGE · TWO SHORES · NO RETURN</text>
  </g>
  <line x1="400" y1="1208" x2="680" y2="1208" stroke="#bfc7cf" stroke-width="0.8" opacity="0.35"/>
</svg>