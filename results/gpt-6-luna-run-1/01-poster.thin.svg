<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">The Last Ferry, 11:40pm</title>
  <desc id="desc">A vintage night-travel poster showing a ferry crossing dark water between two islands beneath a glowing moon.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1b2b"/>
      <stop offset="1" stop-color="#173447"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a4b"/>
      <stop offset="1" stop-color="#091c2a"/>
    </linearGradient>
    <pattern id="grain" width="39" height="43" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1.1" fill="#f5e9c9" opacity=".22"/>
      <circle cx="27" cy="18" r=".8" fill="#f5e9c9" opacity=".16"/>
      <circle cx="14" cy="35" r=".9" fill="#f5e9c9" opacity=".18"/>
      <circle cx="36" cy="39" r=".7" fill="#f5e9c9" opacity=".12"/>
    </pattern>
    <clipPath id="poster">
      <rect width="1080" height="1350"/>
    </clipPath>
  </defs>

  <g clip-path="url(#poster)">
    <rect width="1080" height="1350" fill="url(#sky)"/>

    <!-- Far stars -->
    <g fill="#f1e7cb">
      <circle cx="118" cy="425" r="2" opacity=".7"/>
      <circle cx="216" cy="520" r="1.5" opacity=".48"/>
      <circle cx="884" cy="430" r="2" opacity=".62"/>
      <circle cx="961" cy="512" r="1.4" opacity=".5"/>
      <circle cx="760" cy="469" r="1.5" opacity=".52"/>
      <circle cx="330" cy="457" r="1.3" opacity=".42"/>
      <circle cx="914" cy="317" r="1.3" opacity=".55"/>
      <circle cx="144" cy="300" r="1.5" opacity=".54"/>
    </g>
    <path d="M190 488h18m-9-9v18M906 380h14m-7-7v14" stroke="#f1e7cb" stroke-width="1.5" opacity=".5"/>

    <!-- Moon -->
    <circle cx="800" cy="620" r="94" fill="#e9a967" opacity=".12"/>
    <circle cx="800" cy="620" r="69" fill="#f0bd78"/>
    <path d="M800 551a69 69 0 0 1 0 138 58 58 0 0 0 0-138Z" fill="#d9945d" opacity=".55"/>
    <path d="M767 590c12-12 24-14 38-12m-55 43c7-5 14-7 22-7" fill="none" stroke="#f7d39c" stroke-width="3" opacity=".65"/>

    <!-- Header -->
    <rect x="64" y="58" width="952" height="1.5" fill="#d5c9ad" opacity=".55"/>
    <text x="68" y="104" fill="#dfd4bb" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">ISLAND LINE</text>
    <text x="1012" y="104" text-anchor="end" fill="#dfd4bb" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="3">NIGHT SERVICE · 07</text>

    <!-- Title -->
    <text x="62" y="250" fill="#f3e8ce" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="700" letter-spacing="-5">THE LAST</text>
    <text x="55" y="395" fill="#f3e8ce" font-family="Georgia, 'Times New Roman', serif" font-size="157" font-weight="700" letter-spacing="-7">FERRY</text>
    <path d="M68 430h119" stroke="#e8a46a" stroke-width="5"/>
    <text x="68" y="478" fill="#d9cbb0" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="4">ONE MORE CROSSING BEFORE DAWN</text>

    <!-- Water -->
    <path d="M0 789c112-17 224 13 338-1 123-15 230 11 350 1 143-12 250-12 392 0v561H0Z" fill="url(#water)"/>
    <path d="M0 789c112-17 224 13 338-1 123-15 230 11 350 1 143-12 250-12 392 0" fill="none" stroke="#dba46f" stroke-width="3" opacity=".65"/>

    <!-- Distant ridge -->
    <path d="M0 741 73 727l41-22 31 15 47-52 32 18 52-37 39 14 44-31 55 25 58-20 58 40 42-6 39 29 58-5 32 24 60-13 47 28 55-19 60 25 78-13 66 21v51H0Z" fill="#193443"/>
    <path d="M0 741 73 727l41-22 31 15 47-52 32 18 52-37 39 14 44-31 55 25 58-20 58 40 42-6 39 29 58-5 32 24 60-13 47 28 55-19 60 25 78-13 66 21" fill="none" stroke="#365260" stroke-width="2" opacity=".75"/>

    <!-- Island silhouettes -->
    <path d="M0 807v-90l46-12 26-29 30 7 30-47 33 15 34-30 35 10 19 36 36 10 35 43 28 9v78Z" fill="#102737"/>
    <path d="M1080 807v-78l-40-16-26-41-38 8-28-32-36 18-21-32-45 13-26 50-38 8-26 46-32 16v40Z" fill="#102737"/>
    <g fill="#e9b26f">
      <rect x="156" y="690" width="8" height="13" rx="1"/>
      <rect x="239" y="734" width="7" height="11" rx="1"/>
      <rect x="881" y="701" width="8" height="13" rx="1"/>
      <rect x="958" y="744" width="7" height="11" rx="1"/>
    </g>
    <path d="M58 787h41m118-2h24m627 0h34m93 2h31" stroke="#e1a86e" stroke-width="2" opacity=".55"/>

    <!-- Route lights -->
    <path d="M205 810c154 22 263 20 371 10 123-12 221-7 302-17" fill="none" stroke="#e4ab72" stroke-width="2" stroke-dasharray="3 15" opacity=".67"/>
    <circle cx="205" cy="810" r="5" fill="#f0ba7c"/>
    <circle cx="878" cy="803" r="5" fill="#f0ba7c"/>

    <!-- Ferry wake -->
    <path d="M360 922c74 13 130 15 203 8 68-7 111-3 151 4" fill="none" stroke="#9bb5b4" stroke-width="3" opacity=".42"/>
    <path d="M400 945c83 12 153 12 225 5m-189 20c65 7 110 8 169 3" fill="none" stroke="#9bb5b4" stroke-width="2" opacity=".24"/>
    <path d="M567 870c-45 21-88 27-134 31m205-27c56 18 100 22 140 23" fill="none" stroke="#b1c5bc" stroke-width="2" opacity=".36"/>

    <!-- Ferry body -->
    <path d="M366 838h349l-41 60c-8 12-21 19-36 19H438c-20 0-36-7-47-22Z" fill="#e7dbc0"/>
    <path d="M366 838h349l-9 14H375Z" fill="#e7a36a"/>
    <path d="M417 830v-48h196v48" fill="#d9cfb8"/>
    <path d="M448 779v-56h128v56" fill="#e7dbc0"/>
    <path d="M465 736h28v32h-28zm42 0h28v32h-28zm42 0h12v32h-12z" fill="#173447"/>
    <path d="M429 791h27v28h-27zm42 0h27v28h-27zm42 0h27v28h-27zm42 0h27v28h-27zm42 0h22v28h-22z" fill="#183849"/>
    <path d="M454 717h116l-14-14H470Z" fill="#e7dbc0"/>
    <path d="M519 699v-31h7v31m0-26 20 8" fill="none" stroke="#e7dbc0" stroke-width="5" stroke-linecap="round"/>
    <path d="M487 702h45m-93 126h241" stroke="#f4e9cf" stroke-width="3" opacity=".75"/>
    <circle cx="670" cy="864" r="4" fill="#e89560"/>
    <path d="M382 850v26m18-26v37m276-37v25" stroke="#b6a891" stroke-width="2" opacity=".8"/>
    <path d="M405 916h226" stroke="#d28c5b" stroke-width="4"/>

    <!-- Water reflections -->
    <path d="M476 957h186m-214 20h149m98-7h88m-374 34h216m-105 19h83m105-52h72" stroke="#dfaa71" stroke-width="3" opacity=".32"/>
    <path d="M328 1021h92m-110 19h55m403-43h118m-85 22h68" stroke="#9ab6b4" stroke-width="2" opacity=".27"/>

    <!-- Route title and time -->
    <rect x="64" y="1080" width="952" height="1.5" fill="#d5c9ad" opacity=".55"/>
    <text x="68" y="1133" fill="#d9cbb0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">NORTH ISLE</text>
    <text x="1012" y="1133" text-anchor="end" fill="#d9cbb0" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="3">SOUTH ISLE</text>
    <path d="M290 1125h500" stroke="#d9cbb0" stroke-width="1.5" opacity=".45"/>
    <path d="m779 1118 8 7-8 7" fill="none" stroke="#e8a46a" stroke-width="2.5"/>
    <text x="540" y="1227" text-anchor="middle" fill="#f0b276" font-family="Georgia, 'Times New Roman', serif" font-size="94" font-weight="700" letter-spacing="2">11:40<tspan font-size="42" baseline-shift="super">PM</tspan></text>
    <text x="540" y="1273" text-anchor="middle" fill="#e0d4ba" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4">LAST DEPARTURE · WEATHER PERMITTING</text>
    <rect x="64" y="1303" width="952" height="1.5" fill="#d5c9ad" opacity=".55"/>

    <!-- Screenprint grain and inset frame -->
    <rect width="1080" height="1350" fill="url(#grain)" opacity=".35"/>
    <rect x="35" y="35" width="1010" height="1280" fill="none" stroke="#d5c9ad" stroke-width="1" opacity=".42"/>
  </g>
</svg>
