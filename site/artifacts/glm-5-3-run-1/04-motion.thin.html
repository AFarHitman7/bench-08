<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280, initial-scale=1">
<title>DRIFT — Title Card</title>
<style>
  html, body { margin: 0; padding: 0; width: 1280px; height: 720px; overflow: hidden; background: #04060b; }
  canvas { display: block; width: 1280px; height: 720px; }
</style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script>
(function () {
  "use strict";
  var W = 1280, H = 720, D = 8, K = Math.PI / 4, TAU = 6.28318530718;
  var cv = document.getElementById("c");
  var ctx = cv.getContext("2d");

  /* Seeded PRNG: every random value is fixed at load, so render(t) is a pure
     function of t and seek(t) is fully deterministic. All oscillation
     frequencies are integer multiples of K (= 2π / 8s), so the 8s loop is
     seamless: phase advances by exactly 2π·n per cycle. */
  function mulberry32(a){ return function(){ a|=0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
  var rnd = mulberry32(0x0D21F7);
  function ease(x){ x = x < 0 ? 0 : x > 1 ? 1 : x; return x * x * (3 - 2 * x); }
  function mod(a, m){ return a - Math.floor(a / m) * m; }
  function line(x1, y1, x2, y2){ ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

  /* ---------- static gradients ---------- */
  var bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, "#0a1020");
  bgGrad.addColorStop(0.55, "#060a14");
  bgGrad.addColorStop(1, "#03050a");
  var vig = ctx.createRadialGradient(W/2, H/2, H*0.32, W/2, H/2, W*0.72);
  vig.addColorStop(0, "rgba(2,4,9,0)");
  vig.addColorStop(1, "rgba(1,2,6,0.62)");

  /* ---------- film grain tile (precomputed, seeded) ---------- */
  var gcv = document.createElement("canvas");
  gcv.width = 256; gcv.height = 256;
  var gtx = gcv.getContext("2d");
  (function () {
    var i;
    for (i = 0; i < 9000; i++) {
      gtx.fillStyle = rnd() > 0.5
        ? "rgba(255,255,255," + (0.02 + rnd() * 0.10).toFixed(3) + ")"
        : "rgba(0,0,0," + (0.02 + rnd() * 0.12).toFixed(3) + ")";
      gtx.fillRect((rnd() * 256) | 0, (rnd() * 256) | 0, 1, 1);
    }
  })();
  var grainPat = ctx.createPattern(gcv, "repeat");
  var grainOff = [];
  (function () { var f; for (f = 0; f < 192; f++) grainOff.push((rnd()*256)|0, (rnd()*256)|0); })();

  /* ---------- ambient world: dust, bokeh, wind streaks ---------- */
  var MX = W + 80, MY = H + 80;
  function mkDust(n, smin, smax, amin, amax, rgb) {
    var arr = [], i;
    for (i = 0; i < n; i++) {
      arr.push({
        x0: rnd() * W, y0: rnd() * H,
        nx: [-2, -1, 0, 1, 2, -3, 3][(rnd() * 7) | 0],
        ny: [-1, 0, 1, -2, 2][(rnd() * 5) | 0],
        s: smin + rnd() * (smax - smin),
        a: amin + rnd() * (amax - amin),
        k: 1 + ((rnd() * 6) | 0),
        ph: rnd() * TAU
      });
    }
    return { arr: arr, rgb: rgb };
  }
  var far = mkDust(70, 0.5, 1.3, 0.18, 0.40, "150,180,220");
  var near = mkDust(42, 1.1, 2.4, 0.35, 0.80, "198,222,255");

  var bokeh = [], i;
  for (i = 0; i < 6; i++) {
    bokeh.push({
      x0: rnd() * W, y0: rnd() * H,
      nx: [-1, 0, 1][(rnd() * 3) | 0], ny: [0, 1, -1][(rnd() * 3) | 0],
      r: 28 + rnd() * 46, a: 0.022 + rnd() * 0.03,
      k: 1 + ((rnd() * 2) | 0), ph: rnd() * TAU
    });
  }

  var streaks = [];
  for (i = 0; i < 7; i++) {
    streaks.push({
      y: 80 + rnd() * 560, len: 130 + rnd() * 260,
      n: [-3, -2, -1, 1, 2, 3][(rnd() * 6) | 0],
      x0: rnd() * W, a: 0.04 + rnd() * 0.07,
      amp: 4 + rnd() * 8, k: 1 + ((rnd() * 3) | 0), ph: rnd() * TAU,
      th: rnd() < 0.3 ? 1.6 : 1
    });
  }

  /* ---------- title layout: D R I F T ---------- */
  var FS = 170, GAP = FS * 0.36, CH = "DRIFT", Y = 340, OUT0 = 6.4;
  ctx.font = "700 " + FS + "px Georgia, 'Times New Roman', serif";
  var LP = [], cum = 0, totalW = 0, j;
  for (j = 0; j < CH.length; j++) totalW += ctx.measureText(CH.charAt(j)).width;
  totalW += GAP * (CH.length - 1);
  var startX = (W - totalW) / 2;
  for (j = 0; j < CH.length; j++) {
    var wI = ctx.measureText(CH.charAt(j)).width;
    LP.push({
      ch: CH.charAt(j),
      cx: startX + cum + wI / 2,
      dir: (j % 2 === 0) ? -1 : 1,
      dIn: 0.05 + j * 0.075,
      dOut: j * 0.08,
      a1: 5 + rnd() * 7,       k1: 1 + ((rnd() * 3) | 0), p1: rnd() * TAU,
      a2: 2 + rnd() * 3,       k2: 1 + ((rnd() * 4) | 0), p2: rnd() * TAU,
      b1: 2.5 + rnd() * 3.5,   k3: 1 + ((rnd() * 3) | 0), p3: rnd() * TAU,
      r1: 0.010 + rnd() * 0.012, k4: 1 + ((rnd() * 2) | 0), p4: rnd() * TAU
    });
    cum += wI + GAP;
  }

  /* ---------- drawing ---------- */
  function drawHaze() {
    var g = ctx.createLinearGradient(0, 300, 0, 560);
    g.addColorStop(0, "rgba(78,118,178,0)");
    g.addColorStop(0.5, "rgba(78,118,178,0.07)");
    g.addColorStop(1, "rgba(78,118,178,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 300, W, 260);
  }

  function drawGlow(t) {
    var env = ease((t - 0.1) / 0.75) * (1 - ease((t - OUT0) / 0.9));
    var pulse = 0.75 + 0.25 * Math.sin(2 * K * t + 0.7);
    ctx.globalCompositeOperation = "lighter";
    var g = ctx.createRadialGradient(W/2, 330, 0, W/2, 330, 380);
    g.addColorStop(0, "rgba(96,148,224," + (0.15 * env * pulse).toFixed(4) + ")");
    g.addColorStop(1, "rgba(96,148,224,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    var g2 = ctx.createRadialGradient(W/2, H * 0.42, 0, W/2, H * 0.42, 620);
    g2.addColorStop(0, "rgba(52,88,150," + (0.05 + 0.015 * Math.sin(K * t)).toFixed(4) + ")");
    g2.addColorStop(1, "rgba(52,88,150,0)");
    ctx.fillStyle = g2; ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = "source-over";
  }

  function drawBokeh(t) {
    ctx.globalCompositeOperation = "lighter";
    for (var b, k = 0; k < bokeh.length; k++) {
      b = bokeh[k];
      var px = mod(b.x0 + b.nx * MX * t / D, MX) - 40;
      var py = mod(b.y0 + b.ny * MY * t / D, MY) - 40;
      var al = b.a * (0.7 + 0.3 * Math.sin(b.k * K * t + b.ph));
      if (al <= 0.004) continue;
      var g = ctx.createRadialGradient(px, py, 0, px, py, b.r);
      g.addColorStop(0, "rgba(130,170,230," + al.toFixed(4) + ")");
      g.addColorStop(1, "rgba(130,170,230,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(px, py, b.r, 0, TAU); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  function drawStreaks(t) {
    ctx.lineCap = "round";
    for (var s, k = 0; k < streaks.length; k++) {
      s = streaks[k];
      var Ms = W + s.len;
      var px = mod(s.x0 + s.n * Ms * t / D, Ms) - s.len / 2;
      var wob = Math.sin(s.k * K * t + s.ph) * s.amp;
      var sg = s.n > 0 ? 1 : -1;
      ctx.strokeStyle = "rgba(146,180,232," + s.a.toFixed(3) + ")";
      ctx.lineWidth = s.th;
      line(px, s.y + wob, px + s.len * sg, s.y + wob);
    }
  }

  function drawDust(t) {
    for (var L = 0; L < 2; L++) {
      var set = L ? near : far;
      if (L) ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "rgb(" + set.rgb + ")";
      for (var k = 0; k < set.arr.length; k++) {
        var p = set.arr[k];
        var px = mod(p.x0 + p.nx * MX * t / D, MX) - 40;
        var py = mod(p.y0 + p.ny * MY * t / D, MY) - 40;
        var al = p.a * (0.55 + 0.45 * Math.sin(p.k * K * t + p.ph));
        if (al <= 0.02) continue;
        ctx.globalAlpha = al;
        ctx.beginPath(); ctx.arc(px, py, p.s, 0, TAU); ctx.fill();
      }
      ctx.globalCompositeOperation = "source-over";
    }
    ctx.globalAlpha = 1;
  }

  function drawLetters(t) {
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = "700 " + FS + "px Georgia, 'Times New Roman', serif";
    for (var idx = 0; idx < LP.length; idx++) {
      var P = LP[idx];
      var u = ease((t - P.dIn) / 0.95);          /* staggered arrival   */
      var v = ease((t - (OUT0 + P.dOut)) / 1.05); /* staggered departure */
      var a = u * (1 - v);
      if (a <= 0.004) continue;

      var spread = idx - 2;
      var dx = P.a1 * Math.sin(P.k1 * K * t + P.p1) + P.a2 * Math.sin(P.k2 * K * t + P.p2);
      var dy = P.b1 * Math.sin(P.k3 * K * t + P.p3);
      var rot = P.r1 * Math.sin(P.k4 * K * t + P.p4);
      var xin = (1 - u) * P.dir * 340;
      var yin = (1 - u) * P.dir * 42;
      var xout = v * spread * 90 + v * v * spread * 180;
      var yout = -(v * v) * 135;
      var xc = P.cx + dx + xin + xout;
      var yc = Y + dy + yin + yout;

      /* motion-trail direction + intensity for the drift echoes */
      var dvx = P.a1 * P.k1 * K * Math.cos(P.k1 * K * t + P.p1) +
                P.a2 * P.k2 * K * Math.cos(P.k2 * K * t + P.p2);
      var dvy = P.b1 * P.k3 * K * Math.cos(P.k3 * K * t + P.p3);
      var tx = P.dir * (1 - u) * 380 - spread * v * 240 + dvx * 4;
      var ty = P.dir * (1 - u) * 46 + v * 180 + dvy * 4;
      var el = Math.sqrt(tx * tx + ty * ty) || 1;
      var m = Math.min(1, el / 620);
      tx /= el; ty /= el;

      ctx.save();
      ctx.translate(xc, yc);
      ctx.rotate(rot);

      /* trailing echoes (the smear of drift) */
      ctx.fillStyle = "#9fbce0";
      for (var g = 6; g >= 1; g--) {
        ctx.globalAlpha = a * 0.085 * (1 - g / 7.5);
        if (ctx.globalAlpha <= 0.004) continue;
        ctx.fillText(P.ch, g * 26 * m * tx, g * 26 * m * ty);
      }

      /* main glyph */
      var gr = ctx.createLinearGradient(0, -80, 0, 62);
      gr.addColorStop(0, "#f5faff");
      gr.addColorStop(0.5, "#d2e3f6");
      gr.addColorStop(1, "#97b9de");
      ctx.globalAlpha = a;
      ctx.fillStyle = gr;
      ctx.shadowColor = "rgba(130,180,255,0.40)";
      ctx.shadowBlur = 22;
      ctx.fillText(P.ch, 0, 0);
      ctx.shadowBlur = 0;
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawRule(t) {
    var rIn = ease((t - 0.35) / 0.8);
    var shrink = 1 - ease((t - 6.95) / 0.75);
    var aR = rIn * shrink;
    if (aR <= 0.004) return;
    var L = 240 * rIn * shrink * (1 + 0.045 * Math.sin(2 * K * t));
    var y = 452;
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(168,192,228," + (0.42 * aR).toFixed(3) + ")";
    ctx.lineWidth = 1.2;
    line(W/2 - L, y, W/2 + L, y);
    ctx.strokeStyle = "rgba(190,212,240," + (0.6 * aR).toFixed(3) + ")";
    line(W/2 - L, y - 4, W/2 - L, y + 4);
    line(W/2 + L, y - 4, W/2 + L, y + 4);
    /* light sweeping along the rule */
    var xs = Math.sin(3 * K * t) * L * 0.55;
    var hl = ctx.createLinearGradient(W/2 + xs - 50, 0, W/2 + xs + 50, 0);
    hl.addColorStop(0, "rgba(210,230,255,0)");
    hl.addColorStop(0.5, "rgba(215,235,255," + (0.55 * aR).toFixed(3) + ")");
    hl.addColorStop(1, "rgba(210,230,255,0)");
    ctx.globalCompositeOperation = "lighter";
    ctx.strokeStyle = hl;
    ctx.lineWidth = 2.2;
    line(W/2 + xs - 50, y, W/2 + xs + 50, y);
    ctx.globalCompositeOperation = "source-over";
  }

  function render(t) {
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    /* the whole world drifts with a slow camera wander */
    var camX = 7 * Math.sin(K * t + 1.3);
    var camY = 5 * Math.sin(2 * K * t + 0.5);
    ctx.save();
    ctx.translate(camX, camY);
    drawHaze();
    drawGlow(t);
    drawBokeh(t);
    drawStreaks(t);
    drawDust(t);
    drawLetters(t);
    drawRule(t);
    ctx.restore();

    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    /* grain, quantised to 24fps frames — a deterministic function of t */
    var fr = Math.floor(t * 24) % 192;
    ctx.save();
    ctx.translate(grainOff[fr * 2] % 256, grainOff[fr * 2 + 1] % 256);
    ctx.globalAlpha = 0.08;
    ctx.fillStyle = grainPat;
    ctx.fillRect(-256, -256, W + 512, H + 512);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  /* ---------- playback control: pure, deterministic, loopable ---------- */
  var tCur = 0, playing = false, rafId = 0, lastNow = 0;
  function tick(now) {
    if (!playing) return;
    var dt = (now - lastNow) / 1000;
    lastNow = now;
    if (dt > 0) tCur = mod(tCur + dt, D);
    render(tCur);
    rafId = requestAnimationFrame(tick);
  }
  function seek(t) {
    tCur = mod((typeof t === "number" && isFinite(t)) ? t : 0, D);
    render(tCur);
    if (playing) lastNow = performance.now();
  }
  function play() {
    if (playing) return;
    playing = true;
    lastNow = performance.now();
    rafId = requestAnimationFrame(tick);
  }
  function pause() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
  }

  window.__anim = { duration: D, seek: seek, play: play, pause: pause };
  seek(0);
  play();
})();
</script>
</body>
</html>
