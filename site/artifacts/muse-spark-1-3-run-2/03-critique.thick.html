<!doctype html>
<!-- Fixed 1) phone layout with viewport and fluid type. 2) dead Get started now Check times and prices. 3) vague hero replaced with route, 3h15, from £29. 4) low-contrast gradient replaced with solid #0B1F3A. 5) generic cards rewritten with 47-sec checkout, fees-included pricing, live SMS status. Left alone: same 3 sections, brand name, footer. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ferryline — Book your crossing</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:#111;background:#fff}.hero{background:#0B1F3A;color:#fff;text-align:center;padding:44px 24px 32px}h1{font-size:44px;margin:0 0 10px}.sub{font-size:17px;color:#e6edf7;max-width:620px;margin:0 auto 18px}.book{background:#fff;border-radius:16px;max-width:860px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;padding:10px}select{font-size:16px;padding:12px;border-radius:10px;min-height:52px}.cta{background:#fbbf24;border-radius:12px;padding:0 28px;font-weight:800;font-size:17px;min-height:56px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:28px 40px;max-width:1100px;margin:0 auto}.card{border:1px solid #e2e8f0;border-radius:14px;padding:18px;background:#f8fafc}footer{padding:14px;text-align:center;color:#64748b;font-size:13px}</style></head>
<body>
<section class="hero"><h1>Check times and book in about a minute</h1><p class="sub">6 sailings daily. Crossing 3h 15m. Returns from £29 with fees included.</p>
<form class="book" onsubmit="return false"><div><select><option>Holyhead</option></select></div><div><select><option>Thu 19 Nov</option></select></div><div><select><option>1 adult</option></select></div><button class="cta" type="submit">Check times &amp; prices</button></form></section>
<section class="cards"><div class="card"><h3>Fast</h3><p><strong>47-second average checkout.</strong> No account needed.</p></div><div class="card"><h3>Simple</h3><p><strong>Return from £29, fees included.</strong></p></div><div class="card"><h3>Reliable</h3><p><strong>Live sailing status by SMS.</strong></p></div></section>
<footer>&copy; Ferryline 2026</footer>
</body></html>
