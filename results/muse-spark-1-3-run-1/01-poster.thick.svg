<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
<style>
  .grotesk { font-family: 'Arial Narrow','Franklin Gothic Condensed','Helvetica Condensed',Impact,'Haettenschweiler',sans-serif; font-stretch: condensed; }
  .mono { font-family: 'Courier New',Courier,ui-monospace,Menlo,Consolas,monospace; }
</style>
<rect x="0" y="0" width="1080" height="1350" fill="#EAE4CE"/>
<!-- top rules -->
<rect x="84" y="84" width="912" height="14" fill="#131736"/>
<rect x="84" y="112" width="20" height="20" fill="#C73A1B"/>
<text class="mono" x="116" y="129" font-size="26" font-weight="700" letter-spacing="1" fill="#131736">NIGHT CROSSING No1140 — DAILY</text>
<text class="mono" x="996" y="129" font-size="26" font-weight="700" letter-spacing="1" fill="#131736" text-anchor="end">SAN REMO — VELL</text>
<rect x="84" y="146" width="912" height="4" fill="#131736"/>
<!-- display title -->
<text class="grotesk" x="78" y="370" font-size="232" font-weight="900" letter-spacing="-4" fill="#131736">THE</text>
<text class="grotesk" x="78" y="572" font-size="232" font-weight="900" letter-spacing="-4" fill="#131736">LAST</text>
<text class="grotesk" x="78" y="774" font-size="232" font-weight="900" letter-spacing="-4" fill="#C73A1B">FERRY</text>
