<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="pt pd">
  <title id="pt">The Last Ferry, 11:40pm</title>
  <desc id="pd">A late-night ferry crossing between two islands beneath a moon that reads as a clock showing 11:40.</desc>

  <defs>
