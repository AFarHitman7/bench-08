      <stop offset="1" stop-color="#e9e0c6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd982" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd982" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#01030a" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#01030a" stop-opacity="0"/>
      <stop offset="1" stop-color="#01030a" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-300%" width="140%" height="700%">
