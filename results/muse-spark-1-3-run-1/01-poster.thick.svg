<text class="mono" x="880" y="430" font-size="26" font-weight="700" fill="#131736">11:40PM</text>
<text class="mono" x="880" y="460" font-size="26" font-weight="400" fill="#131736">SHARP</text>
<rect x="880" y="480" width="116" height="10" fill="#C73A1B"/>
<rect x="880" y="504" width="116" height="4" fill="#131736"/>
